name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

  # ── 2. Frontend tests ──────────────────────────────────────
  test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

  # ── 3. Frontend build check ────────────────────────────────
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vite build
        run: npm run build
        env:
          VITE_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          VITE_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          VITE_STELLAR_CONTRACT_ID: ${{ secrets.VITE_STELLAR_CONTRACT_ID }}
          VITE_STELLAR_EXPLORER_URL: https://stellar.expert/explorer/testnet

  # ── 4. Contract — unit tests + WASM compile ────────────────
  contract:
    name: Contract (test + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            poll_contract/target
          key: cargo-${{ runner.os }}-${{ hashFiles('poll_contract/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo test
        run: cargo test --manifest-path poll_contract/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path poll_contract/Cargo.toml -- -D warnings

      - name: Compile to WASM
        run: cargo build --manifest-path poll_contract/Cargo.toml --target wasm32v1-none --release
